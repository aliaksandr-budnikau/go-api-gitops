apiVersion: apps/v1
kind: Deployment

metadata:
  name: go-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: go-api
  template:
    metadata:
      labels:
        app: go-api
    spec:
      containers:
      - name: go-api
        image: ghcr.io/yourname/go-api:v1
        ports:
        - containerPort: 8070
        readinessProbe:
          httpGet:
            path: /health
            port: 8070
        livenessProbe:
          httpGet:
            path: /health
            port: 8070