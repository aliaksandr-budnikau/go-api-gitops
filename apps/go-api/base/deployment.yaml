apiVersion: apps/v1
kind: Deployment

metadata:
  name: go-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: go-api
  template:
    metadata:
      labels:
        app: go-api
    spec:
      imagePullSecrets:
          - name: ghcr-secret
      containers:
      - name: go-api
        image: go-api
        imagePullPolicy: Always
        ports:
        - containerPort: 8070
        readinessProbe:
          httpGet:
            path: /health
            port: 8070
        livenessProbe:
          httpGet:
            path: /health
            port: 8070