apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: go-api-root
  namespace: argocd
spec:
  project: go-api
  source:
    repoURL: https://github.com/aliaksandr-budnikau/go-api-gitops.git
    targetRevision: main
    path: argocd
    directory:
      exclude: "root-app.yaml" 
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true